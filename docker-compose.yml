services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resumeai
      POSTGRES_USER: resumeai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - resumeai_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumeai -d resumeai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/resumeai
      DB_USERNAME: resumeai
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - see backend/.env.example}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5175}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5175}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-5175}:80"
    depends_on:
      - backend

volumes:
  resumeai_db_data:
